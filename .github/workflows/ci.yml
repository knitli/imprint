# Continuous integration.
#
# Third-party actions are pinned to full commit SHAs (supply-chain requirement,
# docs/requirements/requirements.md section 7). The comment gives the tag.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Install pinned Typst (checksum verified) and pdftotext
        run: |
          ./scripts/install-typst.sh
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - run: npm test
        env:
          # Fail, rather than skip, if the PDF tools are missing.
          IMPRINT_REQUIRE_TYPST: "1"
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  openscg-smoke:
    name: OpenSCG conformance smoke spike
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/openscg-smoke
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run conformance
